name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest -q

  automerge:
    # Agent PRs merge themselves once tests pass. Set repo variable AUTO_MERGE=false
    # to require a human to review and merge instead.
    needs: test
    if: contains(github.event.pull_request.labels.*.name, 'agent-pr') && vars.AUTO_MERGE != 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Merge
        env:
          GH_TOKEN: ${{ secrets.LOOP_TOKEN }}
        run: gh pr merge ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --squash --delete-branch
